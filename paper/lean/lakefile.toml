name = "sketchpad"
defaultTargets = ["Sketchpad"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.35.0"

# The general theorems (Sketchpad/), their sheet-machine forms (Sheet) and the paper-named aliases (Paper).
[[lean_lib]]
name = "Sketchpad"
roots = ["Sketchpad.Interp", "Sketchpad.Pinned", "Sketchpad.Compose", "Sketchpad.Unpinned", "Sketchpad.Policy", "Sheet", "Paper"]
